name: Release

on:
  push:
    tags: [ "v*" ]
  # Dry run: builds everything and uploads the bundles as a workflow artifact,
  # without creating a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  release:
    name: Build bundles & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          pkg_version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "v${pkg_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${pkg_version}" >&2
            exit 1
          fi

      - name: Typecheck & test
        run: |
          bun run typecheck
          bun test

      - name: Build per-platform MCP Bundles
        run: |
          for target in bun-windows-x64 bun-darwin-arm64 bun-darwin-x64 bun-linux-x64 bun-linux-arm64; do
            bun run scripts/package-mcpb.ts --target "$target"
          done

      # Sign before generating SHA256SUMS.txt because `mcpb sign` modifies the .mcpb archive in-place.
      # Requires MCPB_SIGNING_CERT and MCPB_SIGNING_KEY (PEM) secrets on tagged releases;
      # optional MCPB_INTERMEDIATE_CERTS (PEM) is passed via -i when configured.
      - name: Sign & verify MCP Bundles
        env:
          MCPB_SIGNING_CERT: ${{ secrets.MCPB_SIGNING_CERT }}
          MCPB_SIGNING_KEY: ${{ secrets.MCPB_SIGNING_KEY }}
          MCPB_INTERMEDIATE_CERTS: ${{ secrets.MCPB_INTERMEDIATE_CERTS }}
        run: |
          set -euo pipefail
          umask 077
          cert_file="${RUNNER_TEMP}/mcpb-cert.pem"
          key_file="${RUNNER_TEMP}/mcpb-key.pem"
          inter_file="${RUNNER_TEMP}/mcpb-intermediate.pem"
          cleanup() {
            rm -f "$cert_file" "$key_file" "$inter_file"
          }
          trap cleanup EXIT

          sign_args=()
          if [ -n "${MCPB_SIGNING_CERT:-}" ] && [ -n "${MCPB_SIGNING_KEY:-}" ]; then
            printf '%s\n' "$MCPB_SIGNING_CERT" > "$cert_file"
            printf '%s\n' "$MCPB_SIGNING_KEY" > "$key_file"
            sign_args=(-c "$cert_file" -k "$key_file")
            if [ -n "${MCPB_INTERMEDIATE_CERTS:-}" ]; then
              printf '%s\n' "$MCPB_INTERMEDIATE_CERTS" > "$inter_file"
              sign_args+=(-i "$inter_file")
            fi
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            echo "Error: MCPB_SIGNING_CERT and MCPB_SIGNING_KEY secrets must be configured for tag releases." >&2
            exit 1
          else
            echo "::notice::MCPB_SIGNING_CERT/MCPB_SIGNING_KEY not set; signing dry-run bundles with a temporary self-signed certificate."
            sign_args=(--self-signed)
          fi

          for bundle in dist/luminous-mcp-*.mcpb; do
            bun x @anthropic-ai/mcpb sign "${sign_args[@]}" "$bundle"
            # `mcpb verify` validates against the OS trust store, so self-signed certs
            # report untrusted even though the PKCS#7 signature is embedded.
            bun x @anthropic-ai/mcpb verify "$bundle" || echo "::warning::mcpb verify could not chain $bundle to the runner OS trust store"
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum luminous-mcp-*.mcpb > SHA256SUMS.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless: the signing identity is this workflow run (recorded in the public
      # Sigstore log), so no key or certificate has to be bought or stored.
      - name: Sign checksums with cosign
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt

      - name: Generate server.json for MCP Registry
        run: bun run scripts/server-json.ts --out server.json

      - name: Download, verify, and validate with mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"

          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"

          tar xz -f "$archive" mcp-publisher
          ./mcp-publisher validate

      - name: Upload bundles (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: mcpb-bundles
          path: |
            dist/luminous-mcp-*.mcpb
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sigstore.json
            server.json

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/luminous-mcp-*.mcpb dist/SHA256SUMS.txt dist/SHA256SUMS.txt.sigstore.json \
            --title "${GITHUB_REF_NAME}" --generate-notes

      - name: Publish to MCP Registry
        if: github.ref_type == 'tag'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
