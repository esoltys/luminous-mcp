name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    name: Build bundles & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          pkg_version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "v${pkg_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${pkg_version}" >&2
            exit 1
          fi

      - name: Typecheck & test
        run: |
          bun run typecheck
          bun test

      - name: Build per-platform MCP Bundles
        run: |
          for target in bun-windows-x64 bun-darwin-arm64 bun-darwin-x64 bun-linux-x64 bun-linux-arm64; do
            bun run scripts/package-mcpb.ts --target "$target"
          done

      - name: Generate checksums
        working-directory: dist
        run: sha256sum luminous-mcp-*.mcpb > SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/luminous-mcp-*.mcpb dist/SHA256SUMS.txt \
            --title "${GITHUB_REF_NAME}" --generate-notes
