name: ✨ Feature Request
description: Propose a new tool, capability, or improvement for luminous-mcp.
title: 'Feature: '
labels: []
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Pre-flight Checklist
      options:
        - label: I have searched existing issues to ensure this feature hasn't already been requested.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem or workflow?
      description: A clear and concise description of what workflow or prompt you want to enable.
      placeholder: I want my AI assistant to be able to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed MCP Tool or Solution
      description: What tool name, input parameters, or output schema would you like to see?
      placeholder: Introduce tool '...' with schema...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've tried.
    validations:
      required: false